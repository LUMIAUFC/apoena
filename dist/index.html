<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>APOENA</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="APOENA: identificação inicial de possíveis artefatos arqueológicos e orientações de educação patrimonial. LUMIA · UFC Campus Quixadá.">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M16 3c1.2 6.6 6.4 11.8 13 13-6.6 1.2-11.8 6.4-13 13-1.2-6.6-6.4-11.8-13-13 6.6-1.2 11.8-6.4 13-13z' fill='%23A06CE0'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Montserrat:wght@500;600;700&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700&display=swap">
<style>
/* APOENA — estilos com a identidade visual do LUMIA (Design System LUMIA)
   Layout: faixa de marca com o fio em degradê, navegação logo abaixo, coluna única de leitura
   (máx. 48rem), cartões só onde há um objeto a destacar. Violeta, amarelo e ciano são cores de
   marca; o violeta profundo (--accent) é o tom com contraste AA para texto e botões. */
:root {
  --brand-violet: #A06CE0;
  --brand-yellow: #F8C03C;
  --brand-cyan: #1CC2DA;
  --band: #16112A;
  --band-ink: #EDE8F8;
  --paper: #FFFFFF;
  --subtle: #F6F6F7;
  --surface: #FFFFFF;
  --ink: #1E1830;
  --muted: #5D5672;
  --line: #E4DFEE;
  --accent: #6A3FC0;
  --on-accent: #FFFFFF;
  --accent-soft: #F1EBFC;
  --danger: #B3261E;
  --danger-soft: #FCEEEC;
  --ok: #1D7A55;
  --focus: #0E8FA3;
  --warn-soft: #FFF6DF;
  --warn-edge: #8A5A00;
  --stone: #8C8396;
  --stone-edge: #4B4458;
  --shadow: 0 1px 2px rgba(30, 24, 48, .05), 0 6px 20px -8px rgba(30, 24, 48, .12);
  --grad: linear-gradient(90deg, var(--brand-violet), var(--brand-yellow) 55%, var(--brand-cyan));
  --font-display: "Montserrat", "Segoe UI", system-ui, -apple-system, sans-serif;
  --font-body: "Nunito Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-data: "DM Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --content-max: 72rem;
  --r-sm: 8px; --r: 12px; --r-lg: 16px;
  --gutter-l: max(16px, env(safe-area-inset-left, 0px));
  --gutter-r: max(16px, env(safe-area-inset-right, 0px));
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--paper); color: var(--ink); font-family: var(--font-body); font-size: 1.0625rem; line-height: 1.6; -webkit-font-smoothing: antialiased; }
.wrap { max-width: var(--content-max); margin: 0 auto; padding-left: var(--gutter-l); padding-right: var(--gutter-r); padding-block: 0 3rem; }
h1, h2, h3 { font-family: var(--font-display); font-weight: 600; line-height: 1.2; text-wrap: balance; margin: 0; letter-spacing: -.01em; }
h1 { font-size: clamp(1.75rem, 4vw, 2.75rem); font-weight: 700; letter-spacing: -.02em; }
h1:focus { outline: none; }
h1:focus-visible { outline: 3px solid var(--focus); outline-offset: 4px; }
h2 { font-size: 1.25rem; }
h3 { font-size: 1rem; margin-top: .5rem; }
p { margin: 0; }
a { color: var(--accent); text-underline-offset: 2px; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; border-radius: 4px; }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
.muted { color: var(--muted); }
.small { font-size: .875rem; }
.data { font-family: var(--font-data); font-variant-numeric: tabular-nums; }
.label-caps { font-family: var(--font-display); font-size: .68rem; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.eyebrow { display: inline-flex; align-items: center; gap: .5rem; font-family: var(--font-display); font-size: .72rem; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: var(--accent); }
.estrela { width: .8rem; height: .8rem; fill: var(--brand-violet); flex: none; }

/* Pular para o conteúdo */
.pular { position: absolute; left: var(--gutter-l); top: -4rem; z-index: 100; background: var(--surface); color: var(--accent); padding: .6rem 1rem; border-radius: var(--r-sm); font-weight: 700; }
.pular:focus { top: calc(.5rem + env(safe-area-inset-top, 0px)); }

/* Faixa de marca (BrandBar) */
.brandbar { background: var(--band); color: var(--band-ink); }
.brandbar-inner { max-width: var(--content-max); margin: 0 auto; padding-left: var(--gutter-l); padding-right: var(--gutter-r); padding-block: .9rem; display: flex; align-items: center; justify-content: space-between; gap: 1rem; flex-wrap: wrap; }
.brandbar .logos { display: flex; align-items: center; gap: .9rem; min-width: 0; }
.brandbar img { height: 84px; width: auto; display: block; max-width: 100%; }
.brandbar .ufc-plate { background: #FFFFFF; border-radius: var(--r-sm); padding: 6px 9px; display: block; flex: none; }
.brandbar img.logo-ufc { height: 84px; }
.brandbar .logo-sep { width: 1px; height: 60px; background: color-mix(in srgb, var(--band-ink) 28%, transparent); flex: none; }
.brandbar .tag { font-family: var(--font-display); font-weight: 700; font-size: 1.15rem; letter-spacing: .18em; color: var(--band-ink); }
@media (max-width: 30rem) {
  .brandbar .logos { gap: .65rem; }
  .brandbar img.logo-lumia { height: 50px; }
  .brandbar img.logo-ufc { height: 58px; }
  .brandbar .ufc-plate { padding: 5px 7px; }
  .brandbar .tag { font-size: .85rem; }
}
.brandline { height: 3px; background: var(--grad); }

/* Navegação */
.nav { background: var(--surface); border-bottom: 1px solid var(--line); }
.nav ul { list-style: none; margin: 0 auto; max-width: var(--content-max); padding-left: var(--gutter-l); padding-right: var(--gutter-r); padding-block: 0; display: flex; flex-wrap: wrap; gap: 0 .25rem; }
.nav a { display: inline-flex; align-items: center; min-height: 48px; padding: 0 .9rem; color: var(--muted); font-weight: 600; font-size: 1rem; text-decoration: none; border-bottom: 3px solid transparent; }
.nav a:hover { color: var(--ink); }
.nav a[aria-current="page"] { color: var(--accent); border-bottom-color: var(--accent); }
.nav li:first-child a { padding-left: 0; }

/* Cabeçalho de página */
.masthead { padding-block: 2.25rem 1.5rem; display: grid; gap: .75rem; }
.masthead.compacta { padding-block: 1.25rem 1.25rem; }
.lede { color: var(--muted); max-width: 52rem; font-size: 1.15rem; }
section.block > p, .orientacao > p, .faq p { max-width: 62rem; }

/* Indicador de etapas (ProgressMeter) */
.etapas { display: flex; align-items: center; gap: 1rem; padding-block: 1rem .25rem; }
.etapas-texto { font-size: .875rem; white-space: nowrap; color: var(--muted); }
.etapas-texto strong { font-family: var(--font-data); font-weight: 500; color: var(--ink); }
.meter { flex: 1; height: 6px; background: var(--line); border-radius: 999px; overflow: hidden; min-width: 0; }
.meter > span { display: block; height: 100%; background: var(--grad); background-size: 100vw 100%; width: var(--pct, 0%); border-radius: 999px; transition: width .25s ease; }
@media (max-width: 26rem) { .etapas { flex-wrap: wrap; gap: .4rem; } .meter { flex-basis: 100%; } }

/* Avisos (Notice) */
.notice { border: 1px solid var(--line); background: var(--surface); border-radius: var(--r); padding: 1rem 1.15rem; display: grid; gap: .5rem; margin-bottom: 1.5rem; }
.notice h2 { font-family: var(--font-body); font-size: 1rem; font-weight: 700; letter-spacing: 0; }
.notice ul { margin: 0; padding-left: 1.2rem; }
.notice.info { border-left: 4px solid var(--brand-cyan); }
.notice.erro { border-left: 4px solid var(--danger); background: var(--danger-soft); }
.notice.erro:focus { outline: 3px solid var(--focus); outline-offset: 2px; }
.notice.alerta { border: 1px solid color-mix(in srgb, var(--warn-edge) 40%, var(--line)); border-left: 4px solid var(--warn-edge); background: var(--warn-soft); }
.notice.demo { border-style: dashed; background: transparent; }
.selo { display: inline-block; justify-self: start; font-family: var(--font-data); font-size: .75rem; color: var(--muted); border: 1px dashed var(--line); border-radius: 999px; padding: .1rem .6rem; }

/* Blocos e listas */
section.block { display: grid; gap: 1rem; margin-bottom: 2.5rem; }
.block-head { display: flex; align-items: baseline; justify-content: space-between; gap: .5rem 1rem; flex-wrap: wrap; padding-bottom: .6rem; border-bottom: 1px solid var(--line); }
.lista { margin: 0; padding-left: 1.2rem; display: grid; gap: .4rem; }
.passos { list-style: none; margin: 0; padding: 0; display: grid; gap: 1rem 2rem; grid-template-columns: repeat(auto-fit, minmax(16rem, 1fr)); }
.passos li { display: grid; grid-template-columns: auto 1fr; gap: .9rem; align-items: start; }
.passos li > div { min-width: 0; }
.num { font-family: var(--font-data); font-size: .85rem; font-weight: 500; color: var(--accent); background: var(--accent-soft); border-radius: 999px; padding: .15rem .6rem; margin-top: .1rem; }
.links-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(15rem, 1fr)); gap: 1rem; }
.link-card { display: grid; gap: .35rem; padding: 1.1rem 1.15rem; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); text-decoration: none; color: var(--ink); box-shadow: var(--shadow); transition: border-color .15s; }
.link-card strong { color: var(--accent); font-family: var(--font-display); font-weight: 600; }
.link-card:hover { border-color: var(--accent); }
.cartao { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 1.15rem; display: grid; gap: 1rem; box-shadow: var(--shadow); margin-bottom: 1.5rem; }
.cartao.local { box-shadow: none; margin-bottom: 0; }
.cartao.has-error { border-color: var(--danger); border-width: 2px; }

/* Legislação e informações */
dl.info, dl.lei { margin: 0; display: grid; gap: 1rem; }
dl.info dt, dl.lei dt { font-family: var(--font-display); font-size: .68rem; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
dl.info dd, dl.lei dd { margin: .2rem 0 0; }
@media (min-width: 56rem) { .painel dl.info { grid-template-columns: 1fr 1fr; gap: 1.25rem 2.5rem; } }
dl.lei div { display: grid; grid-template-columns: 4.5rem 1fr; gap: .75rem; align-items: baseline; }
dl.lei dt { font-family: var(--font-data); font-size: .85rem; letter-spacing: 0; text-transform: none; color: var(--accent); }
dl.lei dd { margin: 0; }
.duas-colunas { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.6fr); gap: 1.5rem; align-items: start; }
@media (max-width: 40rem) { .duas-colunas { grid-template-columns: 1fr; } }

/* Esquema da lâmina */
.esquema { margin: 0; display: grid; gap: .5rem; }
.esquema svg { width: 100%; max-width: 22rem; height: auto; }
.esquema .pedra { fill: var(--stone); stroke: var(--stone-edge); stroke-width: 2; }
.esquema .gume { fill: none; stroke: var(--brand-cyan); stroke-width: 4; stroke-linecap: round; }
.esquema .guia { stroke: var(--muted); stroke-width: 1; stroke-dasharray: 3 3; }
.esquema .rot { fill: var(--ink); font-family: var(--font-display); font-size: 13px; font-weight: 600; }
.esquema .rot.sub { fill: var(--muted); font-weight: 400; }

/* Botões (Button) */
.actions { display: flex; flex-wrap: wrap; gap: .6rem; align-items: center; }
button, .btn { font: inherit; font-weight: 600; font-size: .925rem; cursor: pointer; border-radius: 999px; padding: .65rem 1.25rem; min-height: 44px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); text-decoration: none; display: inline-flex; align-items: center; justify-content: center; text-align: center; transition: border-color .15s, background-color .15s; }
button:hover, .btn:hover { border-color: var(--accent); color: var(--accent); }
button.primary, .btn.primary { background: var(--accent); color: var(--on-accent); border-color: var(--accent); padding-inline: 1.5rem; box-shadow: 0 6px 16px -6px color-mix(in srgb, var(--accent) 60%, transparent); }
button.primary:hover, .btn.primary:hover { background: color-mix(in srgb, var(--accent) 88%, var(--ink)); color: var(--on-accent); }
button.grande { min-height: 3.5rem; font-size: 1rem; }
.toolbar { display: flex; flex-wrap: wrap; gap: .75rem; justify-content: space-between; align-items: center; border-top: 1px solid var(--line); padding-top: 1.5rem; }

/* Captura e foto */
.envio { display: grid; justify-items: center; text-align: center; gap: .6rem; padding: 2rem 1rem; border: 2px dashed var(--line); border-radius: var(--r); background: var(--subtle); transition: border-color .15s, background-color .15s; }
.envio.arrastando { border-color: var(--accent); background: var(--accent-soft); }
.preview { margin: 0; display: grid; gap: .4rem; }
.preview img { width: 100%; max-height: 22rem; object-fit: contain; background: var(--subtle); border-radius: var(--r-sm); border: 1px solid var(--line); }
img.mini { width: 7rem; height: 7rem; object-fit: cover; border-radius: var(--r-sm); border: 1px solid var(--line); flex: none; }
details.dicas, .faq details { border: 1px solid var(--line); border-radius: var(--r); padding: .8rem 1.1rem; background: var(--surface); margin-bottom: 1rem; }
details summary { cursor: pointer; font-weight: 700; min-height: 28px; }
details[open] summary { margin-bottom: .6rem; }

/* Análise */
.analise { display: grid; justify-items: center; text-align: center; gap: 1rem; padding-block: 3rem; }
.anel { width: 3rem; height: 3rem; border-radius: 50%; border: 4px solid var(--line); border-top-color: var(--brand-violet); border-right-color: var(--brand-yellow); border-bottom-color: var(--brand-cyan); animation: girar 1s linear infinite; }
@keyframes girar { to { transform: rotate(360deg); } }

/* Painel de resultado (ScorePanel) */
.painel { display: grid; gap: 1.25rem; padding: 1.5rem 1.25rem 1.25rem; margin-bottom: 1.5rem; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow); position: relative; overflow: hidden; }
.painel::before { content: ""; position: absolute; inset: 0 0 auto 0; height: 4px; background: var(--grad); }
.painel .notice { margin-bottom: 0; }
.painel-topo { display: flex; gap: 1.25rem; align-items: center; flex-wrap: wrap; }
.confianca { display: grid; gap: .35rem; flex: 1; min-width: 12rem; }
.confianca .valor { font-family: var(--font-display); font-size: clamp(2.6rem, 9vw, 3.6rem); font-weight: 700; line-height: 1; letter-spacing: -.03em; }
.escala { height: 10px; background: var(--line); border-radius: 999px; overflow: hidden; }
.escala span { display: block; height: 100%; background: var(--grad); background-size: 100% 100%; clip-path: inset(0 calc(100% - var(--pct, 0%)) 0 0 round 999px); }

/* Formulários (Field) */
.fields { display: grid; grid-template-columns: repeat(auto-fit, minmax(14rem, 1fr)); gap: 1.1rem 1rem; }
.field { display: grid; gap: .35rem; min-width: 0; align-content: start; }
.field.full { grid-column: 1 / -1; }
.field.compacto { max-width: 18rem; }
.field label { font-weight: 600; font-size: .925rem; }
.field .hint { font-size: .8rem; color: var(--muted); }
.field input, .field textarea, .field select { font: inherit; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-sm); padding: .65rem .8rem; width: 100%; min-height: 44px; }
.field input:focus, .field textarea:focus, .field select:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 30%, transparent); }
.field textarea { min-height: 6rem; resize: vertical; }
.field textarea.resumo { font-family: var(--font-data); font-size: .85rem; background: var(--accent-soft); }
.err { color: var(--danger); font-size: .875rem; font-weight: 600; }
.field.has-error input, .field.has-error textarea { border-color: var(--danger); border-width: 2px; }
.check { display: flex; gap: .65rem; align-items: center; min-height: 44px; }
.check input { width: 1.35rem; height: 1.35rem; accent-color: var(--accent); flex: none; margin: 0; }
.check label { font-weight: 600; }
fieldset.opcoes { border: 0; margin: 0; padding: 0; display: grid; gap: .5rem; min-width: 0; }
fieldset.opcoes legend { font-weight: 700; font-size: 1.02rem; margin-bottom: .5rem; padding: 0; }
fieldset.opcoes.linha { grid-template-columns: repeat(auto-fit, minmax(9rem, 1fr)); }
fieldset.opcoes.linha legend, fieldset.opcoes.linha .err { grid-column: 1 / -1; }
.opcao { display: flex; align-items: center; gap: .75rem; min-height: 48px; padding: .6rem .9rem; border: 1px solid var(--line); border-radius: var(--r-sm); background: var(--surface); cursor: pointer; }
.opcao input { width: 1.2rem; height: 1.2rem; accent-color: var(--accent); margin: 0; flex: none; }
.opcao:has(input:checked) { border-color: var(--accent); background: var(--accent-soft); font-weight: 700; }
.opcao:has(input:focus-visible) { outline: 3px solid var(--focus); outline-offset: 2px; }
fieldset.has-error .opcao { border-color: var(--danger); }
.orientacao { display: grid; gap: .6rem; padding-top: .25rem; }
.fotos { display: grid; grid-template-columns: repeat(auto-fill, minmax(13rem, 18rem)); gap: 1rem; }
.foto-item { display: grid; gap: .5rem; align-content: start; }
.foto-item img { width: 100%; aspect-ratio: 4 / 3; max-width: 100%; object-fit: cover; border-radius: var(--r-sm); border: 1px solid var(--line); }
#resumo-erros, .field, fieldset, .cartao { scroll-margin-top: 1.5rem; }

/* Rodapé */
.sitefoot { border-top: 1px solid var(--line); }
.sitefoot-inner { max-width: var(--content-max); margin: 0 auto; padding-left: var(--gutter-l); padding-right: var(--gutter-r); padding-block: 1.25rem 2rem; display: flex; flex-wrap: wrap; gap: .5rem 1.5rem; justify-content: space-between; font-size: .8rem; color: var(--muted); }
.sitefoot strong { font-family: var(--font-display); color: var(--ink); letter-spacing: .04em; }
.sitefoot a { font-weight: 700; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition: none !important; animation: none !important; }
  .anel { border-top-color: var(--brand-violet); }
}
</style>
</head>
<body>
<a class="pular" href="#conteudo">Pular para o conteúdo</a>

<header class="brandbar">

<script>
/* js/config.js */
/*
 * APOENA — Configuração do frontend
 * ------------------------------------------------------------------
 * Este é o ÚNICO arquivo que precisa ser alterado para ligar o frontend
 * ao modelo de visão computacional (ver também js/servico-identificacao.js).
 */
window.APOENA = window.APOENA || {};

window.APOENA.config = {
  /* ================================================================
   * >>> INTEGRAÇÃO DO MODELO DE VISÃO COMPUTACIONAL — PASSO 1 <<<
   * ----------------------------------------------------------------
   * Enquanto o modelo não existir, MODO = "simulado": o frontend usa
   * respostas de exemplo (js/servico-identificacao.js → simularResposta).
   *
   * Quando a API do modelo estiver no ar:
   *   1. troque MODO para "api";
   *   2. preencha API_URL com o endereço do serviço (sem barra no fim);
   *   3. ajuste API_ROTA_IDENTIFICAR, se a rota for outra;
   *   4. confira o formato da resposta no contrato descrito em
   *      js/servico-identificacao.js e no README.md.
   * Nenhuma tela precisa ser alterada.
   * ================================================================ */
  MODO: "simulado", // "simulado" | "api"
  API_URL: "",      // ex.: "https://apoena-api.exemplo.ufc.br"
  API_ROTA_IDENTIFICAR: "/v1/identificar",
  API_TOKEN: "",    // se a API exigir chave, NÃO versionar o valor real

  // Tempo máximo de espera pela resposta do modelo (ms). RNF02.
  TEMPO_LIMITE_MS: 30000,

  // Abaixo deste grau de confiança (0 a 1), o resultado é tratado como
  // "não identificado". Valor provisório: definir com a equipe e o arqueólogo.
  LIMIAR_CONFIANCA: 0.6,

  // Imagens aceitas no envio.
  TIPOS_IMAGEM: ["image/jpeg", "image/png", "image/webp", "image/heic", "image/heif"],
  TAMANHO_MAX_MB: 10,

  // Simulação: resultado padrão quando MODO = "simulado".
  // "identificado" | "nao_identificado" | "erro" | "tempo_esgotado"
  // Na interface, o painel "Modo de demonstração" permite trocar o cenário.
  SIMULACAO_PADRAO: "identificado",
  SIMULACAO_ATRASO_MS: 1800,
};
</script>

      partes: [

<script>
/* js/servico-identificacao.js */
/*
 * APOENA — Serviço de identificação (camada de integração)
 * ------------------------------------------------------------------
 * As telas NUNCA falam com o modelo diretamente: elas chamam apenas
 *
 *     APOENA.identificacao.identificar(arquivoImagem, { sinal })
 *
 * e recebem sempre um objeto no FORMATO NORMALIZADO abaixo. Para trocar
 * a simulação pelo modelo real, basta implementar a chamada em
 * `chamarApi` (PASSO 2) e, se o modelo responder em outro formato,
 * adaptar `normalizarResposta` (PASSO 3). RNF02 do Documento de Visão.
 *
 * ------------------------------------------------------------------
 * CONTRATO DE INTEGRAÇÃO (proposta — validar com a equipe do modelo)
 * ------------------------------------------------------------------
 * Requisição
 *   POST {API_URL}{API_ROTA_IDENTIFICAR}
 *   Content-Type: multipart/form-data
 *   Campo "imagem": arquivo da foto (JPEG, PNG, WEBP ou HEIC)
 *
 * Resposta 200 (JSON)
 *   {
 *     "status": "identificado" | "nao_identificado",
 *     "classe": "lamina_machado_polida",     // id da classe prevista
 *     "confianca": 0.87,                     // 0 a 1
 *     "alternativas": [                      // opcional
 *       { "classe": "...", "confianca": 0.08 }
 *     ],
 *     "modelo": { "nome": "apoena-vc", "versao": "0.1.0" },
 *     "id_analise": "a1b2c3"                 // opcional, para rastreio
 *   }
 *
 * Erros: HTTP 4xx/5xx com { "erro": "mensagem" } são tratados como
 * falha de comunicação; a interface oferece nova tentativa.
 *
 * ------------------------------------------------------------------
 * FORMATO NORMALIZADO (o que as telas recebem)
 * ------------------------------------------------------------------
 *   {
 *     status: "identificado" | "nao_identificado" | "erro",
 *     classe: string | null,
 *     confianca: number | null,     // 0 a 1
 *     artefato: objeto de APOENA.conteudo.artefatos | null,
 *     modelo: { nome, versao } | null,
 *     simulado: boolean,            // true enquanto não houver modelo
 *     erro: { tipo: "tempo_esgotado" | "rede" | "servidor" | "cancelado", mensagem } | null
 *   }
 */
(function () {
  const cfg = () => window.APOENA.config;

  /* Cenário de simulação escolhido no painel de demonstração. */
  let cenarioSimulado = null;
  function definirCenarioSimulado(cenario) { cenarioSimulado = cenario; }
  function obterCenarioSimulado() { return cenarioSimulado || cfg().SIMULACAO_PADRAO; }
  function estaSimulando() { return cfg().MODO !== "api"; }

  /* Validação local da imagem antes do envio. */
  function validarImagem(arquivo) {
    if (!arquivo) return "Escolha ou tire uma foto do objeto.";
    const tipoOk = cfg().TIPOS_IMAGEM.includes(arquivo.type) || /\.(jpe?g|png|webp|heic|heif)$/i.test(arquivo.name || "");
    if (!tipoOk) return "Formato não aceito. Envie uma foto em JPG, PNG, WEBP ou HEIC.";
    if (arquivo.size > cfg().TAMANHO_MAX_MB * 1024 * 1024) {
      return `A foto tem mais de ${cfg().TAMANHO_MAX_MB} MB. Tire outra foto ou reduza o tamanho da imagem.`;
    }
    return null;
  }

  /* Ponto de entrada usado pelas telas. */
  async function identificar(arquivo, { sinal } = {}) {
    try {
      const bruta = estaSimulando()
        ? await simularResposta(obterCenarioSimulado(), sinal)
        : await chamarApi(arquivo, sinal);
      return normalizarResposta(bruta);
    } catch (e) {
      return respostaDeErro(e);
    }
  }

  /* ================================================================
   * >>> INTEGRAÇÃO DO MODELO DE VISÃO COMPUTACIONAL — PASSO 2 <<<
   * ----------------------------------------------------------------
   * Chamada real ao serviço do modelo. Já está escrita segundo o
   * contrato acima; revise rota, campo do arquivo e cabeçalhos quando
   * a API for definida. Se o modelo rodar no próprio navegador
   * (ex.: TensorFlow.js ou ONNX Runtime Web), substitua o corpo desta
   * função pela inferência local e devolva o mesmo JSON do contrato.
   * ================================================================ */
  async function chamarApi(arquivo, sinalExterno) {
    const c = cfg();
    if (!c.API_URL) throw criarErro("servidor", "O endereço do serviço de identificação não foi configurado.");

    const controle = new AbortController();
    const limite = setTimeout(() => controle.abort("tempo_esgotado"), c.TEMPO_LIMITE_MS);
    if (sinalExterno) sinalExterno.addEventListener("abort", () => controle.abort("cancelado"), { once: true });

    const corpo = new FormData();
    corpo.append("imagem", arquivo, arquivo.name || "foto.jpg");

    const cabecalhos = {};
    if (c.API_TOKEN) cabecalhos.Authorization = `Bearer ${c.API_TOKEN}`;

    let resposta;
    try {
      resposta = await fetch(c.API_URL + c.API_ROTA_IDENTIFICAR, {
        method: "POST", body: corpo, headers: cabecalhos, signal: controle.signal,
      });
    } catch (e) {
      if (controle.signal.aborted) {
        throw criarErro(controle.signal.reason === "cancelado" ? "cancelado" : "tempo_esgotado");
      }
      throw criarErro("rede");
    } finally {
      clearTimeout(limite);
    }
    if (!resposta.ok) throw criarErro("servidor", `O serviço respondeu com erro (${resposta.status}).`);
    return resposta.json();
  }

  /* ================================================================
   * >>> INTEGRAÇÃO DO MODELO DE VISÃO COMPUTACIONAL — PASSO 3 <<<
   * ----------------------------------------------------------------
   * Converte a resposta do modelo para o formato normalizado. Se a API
   * devolver outros nomes de campo (ex.: "label", "score"), faça o
   * mapeamento aqui. O conteúdo exibido ao usuário vem de
   * APOENA.conteudo.artefatos[classe]: cada nova classe do modelo
   * precisa de uma entrada lá, validada pelo arqueólogo.
   * ================================================================ */
  function normalizarResposta(bruta) {
    const classe = bruta.classe ?? null;
    const confianca = typeof bruta.confianca === "number" ? bruta.confianca : null;
    const artefato = classe ? window.APOENA.conteudo.artefatos[classe] || null : null;

    let status = bruta.status === "identificado" ? "identificado" : "nao_identificado";
    // Confiança abaixo do limiar ou classe sem conteúdo cadastrado → não identificado.
    if (status === "identificado" && (!artefato || confianca === null || confianca < cfg().LIMIAR_CONFIANCA)) {
      status = "nao_identificado";
    }
    return {
      status,
      classe,
      confianca,
      artefato: status === "identificado" ? artefato : null,
      modelo: bruta.modelo || null,
      simulado: estaSimulando(),
      erro: null,
    };
  }

  function criarErro(tipo, mensagem) {
    const e = new Error(mensagem || tipo);
    e.tipo = tipo;
    return e;
  }

  const MENSAGENS_ERRO = {
    tempo_esgotado: "A análise demorou mais que o esperado. Verifique a conexão e tente de novo.",
    rede: "Não foi possível falar com o serviço de identificação. Verifique a conexão com a internet e tente de novo.",
    servidor: "O serviço de identificação está indisponível no momento. Tente de novo em alguns minutos.",
    cancelado: "Análise cancelada.",
  };

  function respostaDeErro(e) {
    const tipo = e && e.tipo ? e.tipo : "servidor";
    return {
      status: "erro", classe: null, confianca: null, artefato: null, modelo: null,
      simulado: estaSimulando(),
      erro: { tipo, mensagem: (e && e.tipo && e.message !== e.tipo && e.message) || MENSAGENS_ERRO[tipo] },
    };
  }

  /* Respostas de exemplo no formato do contrato (somente MODO "simulado"). */
  function simularResposta(cenario, sinal) {
    return new Promise((resolver, rejeitar) => {
      const atraso = cenario === "tempo_esgotado" ? Math.min(cfg().SIMULACAO_ATRASO_MS * 2, 4000) : cfg().SIMULACAO_ATRASO_MS;
      const t = setTimeout(() => {
        const modelo = { nome: "simulação", versao: "—" };
        if (cenario === "erro") return rejeitar(criarErro("servidor"));
        if (cenario === "tempo_esgotado") return rejeitar(criarErro("tempo_esgotado"));
        if (cenario === "nao_identificado") {
          return resolver({ status: "nao_identificado", classe: null, confianca: 0.21, modelo });
        }
        resolver({ status: "identificado", classe: "lamina_machado_polida", confianca: 0.87, modelo });
      }, atraso);
      if (sinal) sinal.addEventListener("abort", () => { clearTimeout(t); rejeitar(criarErro("cancelado")); }, { once: true });
    });
  }

  window.APOENA.identificacao = {
    identificar, validarImagem, estaSimulando, definirCenarioSimulado, obterCenarioSimulado,
  };
})();
</script>

  /* ================================================================

  /* ================================================================
   * FLUXO DE IDENTIFICAÇÃO

        <ul class="lista">
          <li>Use luz natural e evite sombras fortes sobre a peça.</li>
          <li>Mostre a peça inteira e chegue perto o bastante para ver a superfície.</li>
          <li>Para dar noção de tamanho, coloque uma caneta ao lado, sem tocar na peça.</li>
        </ul>
      </details>`;
  }

  function receberFoto(arquivo) {
    const erro = ID.validarImagem(arquivo);
    if (erro) { fluxo.erroFoto = erro; renderizar({ focar: false }); anunciar(erro); return; }
    if (fluxo.foto) URL.revokeObjectURL(fluxo.foto.url);
    fluxo.foto = { arquivo, url: URL.createObjectURL(arquivo) };
    fluxo.erroFoto = null;
    renderizar({ focar: false });
    const b = document.getElementById("analisar");
    if (b) b.focus();
    anunciar("Foto carregada. Confira a imagem e escolha Analisar imagem.");
  }

  /* --- Análise (chama a camada de integração) --- */
  function etapaAnalise() {
    return `
      ${indicador("resultado")}
      <section class="analise" aria-busy="true">
        <div class="anel" aria-hidden="true"></div>
        <h1>Analisando a imagem</h1>
        <p class="muted" role="status">Isso pode levar alguns segundos.</p>
        <img class="mini" src="${fluxo.foto.url}" alt="Foto em análise">
        <button type="button" id="cancelar">Cancelar análise</button>
      </section>`;
  }

  async function iniciarAnalise() {
    fluxo.tela = "analise";
    renderizar();
    controleAnalise = new AbortController();
    // >>> As telas chamam SOMENTE este ponto. A integração com o modelo
    // >>> está em js/servico-identificacao.js (PASSOS 2 e 3).
    const r = await ID.identificar(fluxo.foto.arquivo, { sinal: controleAnalise.signal });
    controleAnalise = null;
    if (r.erro && r.erro.tipo === "cancelado") { fluxo.tela = "foto"; renderizar(); anunciar("Análise cancelada."); return; }
    fluxo.resultado = r;
    fluxo.tela = "resultado";
    renderizar();
    anunciar(r.status === "identificado" ? `Resultado: possível ${r.artefato.nome}.` : r.status === "erro" ? "A análise não foi concluída." : "O objeto não foi identificado.");
  }

  /* --- Resultado (RF04 a RF08) --- */
  function etapaResultado() {
    const r = fluxo.resultado;
    if (r.status === "erro") {
      return `
        ${indicador("resultado")}
        <section class="masthead compacta">
          <p class="eyebrow">${estrela}Resultado</p>
          <h1>A análise não foi concluída</h1>
        </section>
        <div class="notice erro" role="alert"><p>${esc(r.erro.mensagem)}</p></div>
        <div class="actions"><button type="button" class="primary" id="tentar">Tentar de novo</button><button type="button" id="outra">Escolher outra foto</button></div>`;
    }
    if (r.status === "nao_identificado") {
      return `
        ${indicador("resultado")}
        <section class="masthead compacta">
          <p class="eyebrow">${estrela}Resultado</p>
          <h1>Não foi possível identificar o objeto</h1>
          <p class="lede">Isso pode acontecer por três motivos: a peça pode não ser um artefato, a foto pode não estar nítida, ou o APOENA ainda não reconhece esse tipo de objeto. Nesta fase, ele reconhece apenas lâminas de machado polidas.</p>
        </section>
        ${r.simulado ? '<p class="selo">Resultado simulado</p>' : ""}
        <div class="notice info" role="note">
          <h2>Ainda acha que pode ser um artefato?</h2>
          <p>Deixe a peça onde está e registre a ocorrência mesmo assim. Um especialista poderá avaliar.</p>
        </div>
        <div class="actions"><button type="button" class="primary" id="outra">Tentar com outra foto</button><button type="button" id="seguir">Registrar mesmo assim</button></div>`;
    }
    const a = r.artefato;
    return `
      ${indicador("resultado")}
      <section class="masthead compacta">
        <p class="eyebrow">${estrela}Resultado da identificação</p>
        <h1>Possível ${esc(a.nome.toLowerCase())}</h1>
      </section>
      <div class="painel">
        <div class="painel-topo">
          <img class="mini" src="${fluxo.foto.url}" alt="Foto do objeto analisado">
          <div class="confianca">
            <p class="label-caps">Grau de confiança do modelo</p>
            <p class="valor data">${pct(r.confianca)}</p>
            <div class="escala" aria-hidden="true"><span style="--pct:${pct(r.confianca)}"></span></div>
            ${r.simulado ? '<p class="selo">Resultado simulado</p>' : ""}
          </div>
        </div>
        <div class="notice info" role="note">
          <h2>Esta identificação é uma estimativa</h2>
          <p>O resultado não substitui a avaliação de um arqueólogo ou do IPHAN.</p>
        </div>
        <dl class="info">
          <div><dt>O que é</dt><dd>${esc(a.oQueE)}</dd></div>
          <div><dt>Possível função</dt><dd>${esc(a.funcao)}</dd></div>
          <div><dt>Matéria-prima</dt><dd>${esc(a.materiaPrima)}</dd></div>
          <div><dt>Por que preservar</dt><dd>${esc(a.educativo)}</dd></div>
        </dl>
      </div>
      <div class="notice alerta" role="note">
        <h2>Não retire o objeto do local</h2>
        <p>Retirar a peça do lugar onde ela está apaga informações sobre a sua origem e prejudica a preservação e a interpretação do achado.</p>
      </div>
      <div class="actions"><button type="button" class="primary" id="seguir">Continuar: o que fazer agora</button><button type="button" id="outra">Analisar outra foto</button></div>`;
  }

  /* --- Retirada do objeto (RF10, RF11, RF12) --- */
  function etapaRetirada() {
    const e = fluxo.erros;
    const sim = fluxo.retirado === "sim", nao = fluxo.retirado === "nao";
    return `
      ${indicador("orientacoes")}
      <section class="masthead compacta">
        <p class="eyebrow">${estrela}Orientações</p>
        <h1>O que fazer com o objeto</h1>
      </section>
      ${resumoErros()}
      <form id="form-retirada" class="cartao" novalidate>
        <fieldset class="opcoes ${e.retirado ? "has-error" : ""}" id="grupo-retirado" ${e.retirado ? 'aria-describedby="retirado-erro"' : ""}>
          <legend>O objeto foi retirado do local onde estava?</legend>
          ${e.retirado ? `<p class="err" id="retirado-erro">${esc(e.retirado)}</p>` : ""}
          <label class="opcao"><input type="radio" name="retirado" value="nao" ${nao ? "checked" : ""}><span>Não, continua no local</span></label>
          <label class="opcao"><input type="radio" name="retirado" value="sim" ${sim ? "checked" : ""}><span>Sim, foi retirado</span></label>
        </fieldset>

        ${nao ? `
          <div class="orientacao">
            <h2>Mantenha o objeto onde está</h2>
            <ul class="lista">
              <li>Não cave ao redor, não lave e não limpe a peça.</li>
              <li>Fotografe o local de longe e de perto, sem mexer em nada.</li>
              <li>Anote como chegar ao lugar ou use a localização do celular.</li>
              <li>Comunique o achado ao IPHAN o quanto antes.</li>
            </ul>
          </div>` : ""}

        ${sim ? `
          <div class="orientacao">
            <h2>Objetos arqueológicos não devem ser removidos do seu contexto</h2>
            <p>Agora que a peça foi retirada, ajude a preservar o que ainda é possível:</p>
            <ul class="lista">
              <li>Guarde a peça em local seguro, sem lavar, colar ou marcar.</li>
              <li>Não separe a peça de outros objetos encontrados junto com ela.</li>
              <li>Anote o lugar exato onde ela estava e comunique o IPHAN.</li>
            </ul>
            <h3>O que diz a lei</h3>
            ${blocoLegislacao()}
          </div>` : ""}

        <div class="actions"><button type="submit" class="primary">Registrar a ocorrência</button><button type="button" id="voltar-resultado">Voltar ao resultado</button></div>
      </form>`;
  }

  /* --- Registro da ocorrência --- */
  const UFS = ["AC","AL","AP","AM","BA","CE","DF","ES","GO","MA","MT","MS","MG","PA","PB","PR","PE","PI","RJ","RN","RS","RO","RR","SC","SP","SE","TO"];

  function campoTexto(id, rotulo, { dica = "", tipo = "input", valor = "", obrig = true } = {}) {
    const erro = fluxo.erros[id];
    const desc = [dica ? `${id}-dica` : "", erro ? `${id}-erro` : ""].filter(Boolean).join(" ");
    const attrs = `id="${id}" ${desc ? `aria-describedby="${desc}"` : ""} ${erro ? 'aria-invalid="true"' : ""} ${obrig ? 'aria-required="true"' : ""}`;
    return `
      <div class="field ${tipo === "textarea" ? "full" : ""} ${erro ? "has-error" : ""}">
        <label for="${id}">${esc(rotulo)}${obrig ? "" : ' <span class="muted">(opcional)</span>'}</label>
        ${dica ? `<span class="hint" id="${id}-dica">${esc(dica)}</span>` : ""}
        ${erro ? `<span class="err" id="${id}-erro">${esc(erro)}</span>` : ""}
        ${tipo === "textarea" ? `<textarea ${attrs}>${esc(valor)}</textarea>` : `<input type="text" ${attrs} value="${esc(valor)}" autocomplete="off">`}
      </div>`;
  }

  function etapaOcorrencia() {
    const o = fluxo.ocorrencia, e = fluxo.erros;
    const temCoord = o.lat !== null;
    return `
      ${indicador("ocorrencia")}
      <section class="masthead compacta">
        <p class="eyebrow">${estrela}Registro da ocorrência</p>
        <h1>Onde o objeto foi encontrado</h1>
        <p class="lede">Essas informações ajudam o IPHAN a localizar e avaliar o achado.</p>
      </section>
      ${resumoErros()}
      <form id="form-ocorrencia" novalidate>
        <section class="block" aria-labelledby="h-local">
          <div class="block-head"><h2 id="h-local">Localização</h2></div>
          <div class="cartao local ${e.local ? "has-error" : ""}" id="local">
            ${e.local ? `<p class="err">${esc(e.local)}</p>` : ""}
            <div class="actions"><button type="button" id="usar-local">${temCoord ? "Atualizar localização" : "Usar minha localização atual"}</button></div>
            <p class="small" role="status" id="geo-status">${temCoord
              ? `Localização registrada: <span class="data">${o.lat.toFixed(5)}, ${o.lon.toFixed(5)}</span>${o.precisao ? ` (precisão de ${Math.round(o.precisao)} m)` : ""}`
              : esc(fluxo.geoStatus || "A localização do celular é a forma mais precisa. Se não for possível, descreva um ponto de referência abaixo.")}</p>
            ${campoTexto("referencia", "Ponto de referência", { dica: "Ex.: Sítio Boa Vista, 2 km depois da ponte, à direita.", valor: o.referencia, obrig: !temCoord })}
          </div>
          <div class="fields">
            ${campoTexto("municipio", "Município", { valor: o.municipio })}
            <div class="field">
              <label for="uf">Estado</label>
              <select id="uf">${UFS.map((u) => `<option${u === o.uf ? " selected" : ""}>${u}</option>`).join("")}</select>
            </div>
          </div>
          <fieldset class="opcoes linha ${e.zona ? "has-error" : ""}" id="grupo-zona" ${e.zona ? 'aria-describedby="zona-erro"' : ""}>
            <legend>O local fica em zona</legend>
            ${e.zona ? `<p class="err" id="zona-erro">${esc(e.zona)}</p>` : ""}
            <label class="opcao"><input type="radio" name="zona" value="Rural" ${o.zona === "Rural" ? "checked" : ""}><span>Rural</span></label>
            <label class="opcao"><input type="radio" name="zona" value="Urbana" ${o.zona === "Urbana" ? "checked" : ""}><span>Urbana</span></label>
          </fieldset>
        </section>

        <section class="block" aria-labelledby="h-desc">
          <div class="block-head"><h2 id="h-desc">Descrição do local</h2></div>
          ${campoTexto("descricao", "Como é o lugar onde o objeto está", { tipo: "textarea", dica: "Ex.: roça de milho perto do açude; terra revirada pelo arado; há cacos de cerâmica por perto.", valor: o.descricao })}
        </section>

        <div class="toolbar"><button type="button" id="voltar-retirada">Voltar</button><button type="submit" class="primary">Gerar resumo da ocorrência</button></div>
      </form>`;
  }

  function resumoErros() {
    const lista = Object.entries(fluxo.erros);
    if (!lista.length) return "";
    const alvo = { retirado: "grupo-retirado", zona: "grupo-zona", local: "local" };
    return `
      <div class="notice erro" id="resumo-erros" tabindex="-1" role="alert">
        <h2>Corrija ${lista.length === 1 ? "o item abaixo" : `os ${lista.length} itens abaixo`}</h2>
        <ul>${lista.map(([k, m]) => `<li><a href="#${alvo[k] || k}" data-foco="${alvo[k] || k}">${esc(m)}</a></li>`).join("")}</ul>
      </div>`;
  }

  function lerOcorrencia() {
    const o = fluxo.ocorrencia;
    const v = (id) => { const el = document.getElementById(id); return el ? el.value.trim() : ""; };
    o.referencia = v("referencia"); o.municipio = v("municipio"); o.descricao = v("descricao");
    o.uf = v("uf") || o.uf;
    const z = document.querySelector('input[name="zona"]:checked'); o.zona = z ? z.value : "";
  }

  function validarOcorrencia() {
    const o = fluxo.ocorrencia, e = {};
    if (o.lat === null && !o.referencia) e.local = "Informe a localização: use a do celular ou descreva um ponto de referência.";
    if (!o.municipio) e.municipio = "Informe o município.";
    if (!o.zona) e.zona = "Escolha se o local fica em zona rural ou urbana.";
    if (!o.descricao) e.descricao = "Descreva o lugar onde o objeto está.";
    return e;
  }

  /* --- Instruções de comunicação (RF13) --- */
  function textoResumo() {
    const r = fluxo.resultado, o = fluxo.ocorrencia;
    const data = new Date().toLocaleString("pt-BR", { dateStyle: "short", timeStyle: "short" });
    const resultado = r && r.status === "identificado"
      ? `Possível ${r.artefato.nome.toLowerCase()} (confiança do modelo: ${pct(r.confianca)}${r.simulado ? ", resultado simulado" : ""})`
      : "Não identificado pelo aplicativo";
    const linhas = [
      "COMUNICAÇÃO DE POSSÍVEL ACHADO ARQUEOLÓGICO — APOENA",
      `Data do registro: ${data}`,
      `Identificação: ${resultado}`,
      `Objeto retirado do local: ${fluxo.retirado === "sim" ? "Sim" : "Não"}`,
    ];
    if (o.lat !== null) linhas.push(`Coordenadas: ${o.lat.toFixed(5)}, ${o.lon.toFixed(5)}`);
    if (o.referencia) linhas.push(`Ponto de referência: ${o.referencia}`);
    linhas.push(`Município: ${o.municipio} – ${o.uf}`, `Zona: ${o.zona}`, `Descrição do local: ${o.descricao}`);
    linhas.push("Fotografia: anexar a foto do objeto ao enviar");
    linhas.push("Observação: a identificação feita pelo APOENA é uma estimativa e não substitui a avaliação de um profissional.");
    return linhas.join("\n");
  }

  function etapaInstrucoes() {
    return `
      ${indicador("comunicar")}
      <section class="masthead compacta">
        <p class="eyebrow">${estrela}Comunicação</p>
        <h1>Comunique o achado ao IPHAN</h1>
        <p class="lede">O resumo abaixo reúne o que o IPHAN precisa saber. Copie e envie junto com a foto do objeto.</p>
      </section>
      <div class="notice info" role="note">
        <p>Nesta versão, o APOENA não envia a ocorrência automaticamente. O envio é feito por você, pelos contatos do IPHAN.</p>
      </div>
      <section class="block" aria-labelledby="h-resumo">
        <div class="block-head"><h2 id="h-resumo">Resumo da ocorrência</h2></div>
        <div class="field full">
          <label for="resumo" class="sr-only">Texto do resumo</label>
          <textarea id="resumo" class="resumo" readonly rows="11">${esc(textoResumo())}</textarea>
        </div>
        <div class="actions"><button type="button" class="primary" id="copiar">Copiar resumo</button></div>
      </section>
      <section class="block" aria-labelledby="h-como">
        <div class="block-head"><h2 id="h-como">Como comunicar</h2></div>
        ${blocoComunicacao()}
      </section>
      <div class="toolbar"><button type="button" id="voltar-ocorrencia">Revisar ocorrência</button><button type="button" class="primary" id="concluir">Concluir</button></div>`;
  }

  function etapaFim() {
    return `
      <section class="masthead">
        <p class="eyebrow">${estrela}Concluído</p>
        <h1>Obrigado por proteger o patrimônio</h1>
        <p class="lede">Com a sua comunicação, o IPHAN pode avaliar o achado e garantir que ele seja preservado.</p>
        <div class="actions"><button type="button" class="primary" id="novo">Identificar outro objeto</button><a class="btn" href="#educacao">Ler sobre educação patrimonial</a></div>
      </section>`;
  }

  /* ================================================================
   * EVENTOS
   * ================================================================ */
  function irPara(tela) { fluxo.tela = tela; fluxo.erros = {}; renderizar(); }
  const $ = (id) => document.getElementById(id);
  const on = (id, ev, fn) => { const el = $(id); if (el) el.addEventListener(ev, fn); };

  function focarErros() {
    const r = $("resumo-erros");
    if (r) r.focus();
    r && r.querySelectorAll("a[data-foco]").forEach((a) => a.addEventListener("click", (ev) => {
      ev.preventDefault();
      const alvo = $(a.dataset.foco);
      const foco = alvo && (alvo.matches("input,textarea,select") ? alvo : alvo.querySelector("input,textarea,select,button"));
      if (foco) foco.focus();
    }));
  }

  function ligarEventos(rota) {
    if (rota !== "identificar") return;
    const t = fluxo.tela;

    if (t === "termo") {
      on("form-termo", "submit", (ev) => {
        ev.preventDefault();
        if (!$("aceite").checked) { fluxo.erros = { termo: true }; renderizar({ focar: false }); $("aceite").focus(); return; }
        gravarSessao("apoena-termo", "1");
        irPara("foto");
      });
    }

    if (t === "foto") {
      on("cenario", "change", (ev) => ID.definirCenarioSimulado(ev.target.value));
      on("galeria", "click", () => $("in-galeria").click());
      on("trocar", "click", () => $("in-galeria").click());
      on("in-galeria", "change", (ev) => { if (ev.target.files[0]) receberFoto(ev.target.files[0]); });
      const area = $("area-envio");
      if (area) {
        area.addEventListener("dragover", (ev) => { ev.preventDefault(); area.classList.add("arrastando"); });
        area.addEventListener("dragleave", () => area.classList.remove("arrastando"));
        area.addEventListener("drop", (ev) => {
          ev.preventDefault(); area.classList.remove("arrastando");
          const f = ev.dataTransfer && ev.dataTransfer.files[0];
          if (f) receberFoto(f);
        });
      }
      on("analisar", "click", iniciarAnalise);
    }

    if (t === "analise") on("cancelar", "click", () => controleAnalise && controleAnalise.abort());

    if (t === "resultado") {
      on("tentar", "click", iniciarAnalise);
      on("outra", "click", () => irPara("foto"));
      on("seguir", "click", () => irPara("retirada"));
    }

    if (t === "retirada") {
      document.querySelectorAll('input[name="retirado"]').forEach((r) => r.addEventListener("change", () => {
        fluxo.retirado = r.value; fluxo.erros = {};
        renderizar({ focar: false });
        document.querySelector(`input[name="retirado"][value="${r.value}"]`).focus();
      }));
      on("voltar-resultado", "click", () => irPara("resultado"));
      on("form-retirada", "submit", (ev) => {
        ev.preventDefault();
        const e = {};
        if (!fluxo.retirado) e.retirado = "Responda se o objeto foi retirado do local.";
        if (Object.keys(e).length) { fluxo.erros = e; renderizar({ focar: false }); focarErros(); return; }
        irPara("ocorrencia");
      });
    }

    if (t === "ocorrencia") {
      on("usar-local", "click", () => {
        lerOcorrencia();
        if (!("geolocation" in navigator)) { fluxo.geoStatus = "Este aparelho não informa a localização. Descreva um ponto de referência."; renderizar({ focar: false }); return; }
        $("geo-status").textContent = "Obtendo a localização…";
        navigator.geolocation.getCurrentPosition(
          (p) => { Object.assign(fluxo.ocorrencia, { lat: p.coords.latitude, lon: p.coords.longitude, precisao: p.coords.accuracy }); fluxo.geoStatus = ""; delete fluxo.erros.local; renderizar({ focar: false }); anunciar("Localização registrada."); $("usar-local").focus(); },
          () => { fluxo.geoStatus = "Não foi possível obter a localização. Verifique a permissão do navegador ou descreva um ponto de referência."; renderizar({ focar: false }); $("usar-local").focus(); },
          { enableHighAccuracy: true, timeout: 15000 }
        );
      });
      on("voltar-retirada", "click", () => { lerOcorrencia(); irPara("retirada"); });
      on("form-ocorrencia", "submit", (ev) => {
        ev.preventDefault();
        lerOcorrencia();
        const e = validarOcorrencia();
        if (Object.keys(e).length) { fluxo.erros = e; renderizar({ focar: false }); focarErros(); return; }
        irPara("instrucoes");
      });
    }

    if (t === "instrucoes") {
      on("copiar", "click", async () => {
        const txt = $("resumo");
        try { await navigator.clipboard.writeText(txt.value); anunciar("Resumo copiado."); $("copiar").textContent = "Resumo copiado"; }
        catch (e) { txt.focus(); txt.select(); anunciar("Texto selecionado. Use o comando copiar do seu aparelho."); }
      });
      on("voltar-ocorrencia", "click", () => irPara("ocorrencia"));
      on("concluir", "click", () => { reiniciarFluxo(); irPara("fim"); });
    }

    if (t === "fim") on("novo", "click", () => { reiniciarFluxo(); renderizar(); });
  }

  // "Pular para o conteúdo": foca o conteúdo sem mexer na rota.
  document.documentElement.lang = "pt-BR";
  const pular = document.querySelector(".pular");
  if (pular) pular.addEventListener("click", (ev) => { ev.preventDefault(); main.focus(); });

  renderizar({ focar: false });
})();
</script>
</body>
</html>
